appId: com.easycut.app
productName: 쉬운편집
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
# resources/ 폴더(ffmpeg, 모델, 폰트, LUT)는 asar 밖 process.resourcesPath 로 복사
extraResources:
  - from: resources/bin
    to: bin
    filter: ['*.exe', '*.dll', 'LICENSE*']
  - from: resources/models
    to: models
  - from: resources/fonts
    to: fonts
  - from: resources/luts
    to: luts
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # GitHub 릴리스는 한글 파일 이름을 바꿔 버려 자동 업데이트가 파일을 못 찾으므로 영문으로
  artifactName: EasyCut-Setup-${version}.${ext}
  shortcutName: 쉬운편집
# 자동 업데이트 (PRD 13장 #11): 앱이 이 저장소의 최신 릴리스를 확인한다. 올리는 법은 CLAUDE.md "## 배포"
publish:
  provider: github
  owner: K-NINEBACH
  repo: easycut
